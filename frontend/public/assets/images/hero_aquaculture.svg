<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#0369a1" />
      <stop offset="70%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="350" fill="url(#skyGrad)" />
  
  <!-- Morning Sun -->
  <circle cx="950" cy="180" r="90" fill="url(#sunGrad)" opacity="0.85" />
  <circle cx="950" cy="180" r="140" fill="#fef08a" opacity="0.15" />

  <!-- Distant Palm Trees & Greenery -->
  <path d="M 0 320 Q 150 290 300 320 T 600 310 T 900 325 T 1200 315 L 1200 350 L 0 350 Z" fill="#065f46" opacity="0.7"/>
  <path d="M 0 335 Q 200 310 450 335 T 850 325 T 1200 340 L 1200 360 L 0 360 Z" fill="#047857" opacity="0.9"/>

  <!-- Pond Embankment -->
  <path d="M 0 355 L 1200 355 L 1200 370 L 0 370 Z" fill="#78350f" opacity="0.6"/>

  <!-- Pond Water -->
  <rect y="365" width="1200" height="235" fill="url(#waterGrad)" />

  <!-- Water Surface Reflections & Ripples -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.4" stroke-width="2.5">
    <line x1="100" y1="390" x2="250" y2="390" />
    <line x1="300" y1="410" x2="520" y2="410" />
    <line x1="600" y1="395" x2="850" y2="395" />
    <line x1="900" y1="420" x2="1150" y2="420" />
    <line x1="150" y1="440" x2="380" y2="440" />
    <line x1="450" y1="465" x2="750" y2="465" />
    <line x1="820" y1="450" x2="1080" y2="450" />
    <line x1="200" y1="495" x2="500" y2="495" />
    <line x1="600" y1="520" x2="950" y2="520" />
    <line x1="100" y1="550" x2="400" y2="550" />
    <line x1="750" y1="565" x2="1100" y2="565" />
  </g>

  <!-- Aerator in Pond (Paddlewheel aerator splash) -->
  <g transform="translate(820, 375)">
    <rect x="0" y="15" width="60" height="8" rx="3" fill="#334155" />
    <circle cx="30" cy="19" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <!-- White Water Splash Spray -->
    <path d="M 10 10 Q 0 -15 20 -5 Q 30 -25 40 -5 Q 60 -15 50 10 Z" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Jumping Healthy Rohu / Carp -->
  <g transform="translate(480, 290) rotate(-15)">
    <path d="M 0 40 C 25 10, 70 5, 100 25 C 85 35, 65 35, 50 45 C 35 38, 20 42, 0 40 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <path d="M 100 25 C 115 15, 120 5, 115 0 C 108 10, 100 20, 100 25 Z" fill="#38bdf8" />
    <path d="M 100 25 C 115 35, 120 45, 115 50 C 108 40, 100 30, 100 25 Z" fill="#38bdf8" />
    <circle cx="20" cy="28" r="3" fill="#0f172a" />
    <!-- Water droplets -->
    <circle cx="-10" cy="55" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="15" cy="65" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="85" cy="50" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
