    <path d="M 20 40 L 280 40 L 270 55 L 30 55 Z" fill="#991b1b" stroke="#fca5a5" stroke-dasharray="4,4" stroke-width="2"/>
    
    <rect x="35" y="75" width="230" height="70" rx="6" fill="#ffffff" />
    <text x="150" y="105" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">AquaGrow Feeds</text>
