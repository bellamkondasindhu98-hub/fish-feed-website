<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Circle -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="48" fill="url(#logoGrad)" />
    <!-- Wave ripples -->
    <path d="M 15 65 Q 35 50 50 65 T 85 65" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 20 75 Q 35 65 50 75 T 80 75" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Stylized leaping fish -->
    <path d="M 28 48 C 35 32, 60 28, 75 42 C 65 48, 55 45, 45 52 C 38 48, 32 50, 28 48 Z" fill="#ffffff" />
    <path d="M 75 42 C 82 35, 84 28, 80 25 C 76 32, 72 38, 75 42 Z" fill="#ffffff" />
    <path d="M 75 42 C 82 48, 85 54, 82 58 C 77 52, 73 45, 75 42 Z" fill="#ffffff" />
    <circle cx="38" cy="40" r="2.5" fill="#0284c7" />
    
    <!-- Nutrition Leaf Emblem -->
    <path d="M 62 26 C 68 20, 78 22, 76 30 C 70 32, 64 30, 62 26 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Typography -->
  <text x="125" y="58" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Aqua<tspan fill="#0284c7">Grow</tspan></text>
  <text x="125" y="86" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#059669" letter-spacing="3.5">FEEDS INDIA</text>
  <text x="125" y="104" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748b" letter-spacing="0.5">Scientific Aquaculture Nutrition</text>
</svg>
